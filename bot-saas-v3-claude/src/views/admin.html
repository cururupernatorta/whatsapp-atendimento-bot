<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Bot SaaS v3 (Claude Edition)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#333;padding:20px}
.container{max-width:1000px;margin:0 auto}
h1{margin-bottom:20px;color:#1a1a1a}
.card{background:white;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.form-group{margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
input,textarea,select{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px}
textarea{min-height:80px;resize:vertical}
button{background:#2563eb;color:white;border:none;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer}
button:hover{background:#1d4ed8}
button.secondary{background:#475569}
button.secondary:hover{background:#334155}
button.danger{background:#dc2626}
button.danger:hover{background:#b91c1c}
button.small{padding:6px 12px;font-size:12px}
.loja-row{display:grid;grid-template-columns:1fr 1.6fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.faq-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.password-bar{display:flex;gap:10px;margin-bottom:20px}
.password-bar input{flex:1}
.hidden{display:none}
.client-item{border:1px solid #e5e5e5;border-radius:8px;padding:16px;margin-bottom:12px}
.client-item h3{margin-bottom:8px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#dcfce7;color:#166534}
.badge.trial{background:#fef3c7;color:#92400e}
.badge.expired{background:#fee2e2;color:#991b1b}
.badge.excedente{background:#fee2e2;color:#991b1b}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-box{background:#f8fafc;padding:16px;border-radius:8px;text-align:center}
.stat-box .number{font-size:24px;font-weight:700;color:#2563eb}
.stat-box .label{font-size:12px;color:#64748b;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 20px;border-radius:8px;cursor:pointer;background:white;border:1px solid #ddd}
.tab.active{background:#2563eb;color:white;border-color:#2563eb}
.tab-content{display:none}
.tab-content.active{display:block}
.webhook-url{background:#f1f5f9;padding:10px;border-radius:6px;font-family:monospace;font-size:13px;word-break:break-all;margin-top:8px}
.lead-item{border:1px solid #e5e5e5;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.lead-item.novo{border-left:4px solid #22c55e}
.lead-item.em_atendimento{border-left:4px solid #f59e0b}
.lead-item.resolvido{border-left:4px solid #6b7280}
</style>
</head>
<body>
<div class="container">
<h1>🤖 Painel Admin — Bot SaaS v3 (Claude Edition)</h1>
<div class="card">
<div class="password-bar">
<input type="password" id="adminPass" placeholder="Senha do admin">
<button onclick="login()">Entrar</button>
</div>
</div>
<div id="painel" class="hidden">
<div class="tabs">
<div class="tab active" onclick="showTab('novo')">+ Novo Cliente</div>
<div class="tab" onclick="showTab('lista')">Clientes</div>
<div class="tab" onclick="showTab('leads')">Leads</div>
<div class="tab" onclick="showTab('stats')">Estatísticas</div>
</div>

<div id="tab-novo" class="tab-content active">
<div class="card">
<h2>Cadastrar Cliente</h2>
<div class="form-group"><label>ID do Cliente</label><input type="text" id="clientId" placeholder="minha-empresa"></div>
<div class="form-group"><label>Nome da Empresa</label><input type="text" id="nomeEmpresa" placeholder="Minha Empresa"></div>
<div class="form-group"><label>Nome do Bot</label><input type="text" id="nomeBot" value="Ana"></div>
<div class="form-group"><label>Chave da WAME API</label><input type="text" id="wameKey"></div>
<div class="form-group"><label>Plano</label>
<select id="plano" onchange="preencherLimitePorPlano()">
<option value="start">Start (3.000 msgs/mês, sem relatório)</option>
<option value="pro" selected>Pro (8.000 msgs/mês, com relatório)</option>
<option value="enterprise">Enterprise (20.000 msgs/mês, com relatório)</option>
</select>
</div>
<div class="form-group"><label>Limite de Mensagens/mês</label><input type="number" id="limiteMensagens" value="8000"></div>
<div class="form-group"><label>Preço por mensagem excedente (R$)</label><input type="number" step="0.01" id="precoPorMensagemExcedente" value="0.10"></div>
<div class="form-group"><label>Trial até (opcional)</label><input type="date" id="trialAte"></div>
<div class="form-group"><label>Descrição</label><textarea id="descricao" placeholder="Rede de óticas com várias filiais na sua região..."></textarea></div>
<div class="form-group"><label>Conhecimento</label><textarea id="conhecimento" placeholder="Informações sobre produtos, serviços, promoções..."></textarea></div>
<div class="form-group"><label>Limites</label><textarea id="limites" placeholder="- Não dê diagnóstico médico.
- Não negocie preços.
- Não invente prazos."></textarea></div>
<div class="form-group"><label>Roteiro de Anamnese (um item por linha — o que o bot deve perguntar antes de considerar o lead pronto)</label><textarea id="roteiroAnamnese" placeholder="Se já usa óculos e qual tipo (grau, sol, lente de contato)
Se já tem receita atualizada
Motivo/urgência da visita
Preferência de produto, se mencionar
Qual filial é mais conveniente"></textarea></div>

<h3 style="margin:20px 0 12px">FAQ (perguntas com resposta imediata, sem custo de IA)</h3>
<div id="faqs"></div>
<button type="button" onclick="addFaq()" class="secondary" style="margin-bottom:20px">+ Adicionar FAQ</button>

<h3 style="margin:20px 0 12px">Filiais</h3>
<div id="lojas"></div>
<button type="button" onclick="addLoja()" class="secondary" style="margin-bottom:20px">+ Adicionar Filial</button>

<button onclick="salvarCliente()">💾 Salvar Cliente</button>
<div class="webhook-url" id="webhookUrl" style="display:none"></div>
</div>
</div>

<div id="tab-lista" class="tab-content">
<div class="card"><h2>Clientes Ativos</h2><div id="listaClientes"></div></div>
</div>

<div id="tab-leads" class="tab-content">
<div class="card">
<h2>Leads</h2>
<div class="form-group">
<select id="leadClientFilter" onchange="carregarLeads()"><option value="">Selecione um cliente</option></select>
</div>
<div id="listaLeads"></div>
</div>
</div>

<div id="tab-stats" class="tab-content">
<div class="card"><h2>Estatísticas (últimos 30 dias, todos os clientes)</h2><div class="stats-grid" id="statsGrid"></div></div>
</div>


</div>
</div>

<script>
let pass='', lojaCount=0, faqCount=0;
const LIMITES_PLANO={start:{limite:3000,preco:0.10},pro:{limite:8000,preco:0.10},enterprise:{limite:20000,preco:0.10}};

function preencherLimitePorPlano(){const p=LIMITES_PLANO[document.getElementById('plano').value];document.getElementById('limiteMensagens').value=p.limite;document.getElementById('precoPorMensagemExcedente').value=p.preco}

function login(){pass=document.getElementById('adminPass').value;document.getElementById('painel').classList.remove('hidden');carregarClientes();carregarStats();carregarClientesNoFiltro()}
function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');document.getElementById('tab-'+t).classList.add('active');if(t=='lista')carregarClientes();if(t=='stats')carregarStats();if(t=='leads')carregarClientesNoFiltro()}

function addLoja(){lojaCount++;const d=document.createElement('div');d.className='loja-row';d.innerHTML=`<input placeholder="Nome (ex: Centro)" id="loja-nome-${lojaCount}"><input placeholder="Endereço completo" id="loja-end-${lojaCount}"><input placeholder="Seg-Sex (08:30-18:30)" id="loja-segsex-${lojaCount}" value="08:30-18:30"><input placeholder="Sáb (08:30-13:00 ou fechado)" id="loja-sabado-${lojaCount}" value="08:30-13:00"><input placeholder="Dom (fechado)" id="loja-domingo-${lojaCount}" value="fechado"><input placeholder="WhatsApp com DDI (ex: 5500900000000)" id="loja-wa-${lojaCount}">`;document.getElementById('lojas').appendChild(d)}

function addFaq(){faqCount++;const d=document.createElement('div');d.className='faq-row';d.innerHTML=`<input placeholder="Pergunta (ex: Vocês fazem entrega?)" id="faq-p-${faqCount}"><input placeholder="Resposta" id="faq-r-${faqCount}">`;document.getElementById('faqs').appendChild(d)}

async function salvarCliente(){const lojas={};for(let i=1;i<=lojaCount;i++){const n=document.getElementById(`loja-nome-${i}`)?.value;if(n){const wa=document.getElementById(`loja-wa-${i}`).value;lojas[i]={nome:`${document.getElementById('nomeEmpresa').value} — ${n}`,endereco:document.getElementById(`loja-end-${i}`).value,horarioSegSex:document.getElementById(`loja-segsex-${i}`).value,horarioSabado:document.getElementById(`loja-sabado-${i}`).value,horarioDomingo:document.getElementById(`loja-domingo-${i}`).value,whatsapp:wa,link:wa?`https://wa.me/${wa}`:''}}}
const faq=[];for(let i=1;i<=faqCount;i++){const p=document.getElementById(`faq-p-${i}`)?.value;if(p){faq.push({pergunta:p,resposta:document.getElementById(`faq-r-${i}`).value})}}
const roteiroAnamnese=document.getElementById('roteiroAnamnese').value.split('\n').map(s=>s.trim()).filter(Boolean);
const payload={clientId:document.getElementById('clientId').value,nomeEmpresa:document.getElementById('nomeEmpresa').value,nomeBot:document.getElementById('nomeBot').value,wameKey:document.getElementById('wameKey').value,plano:document.getElementById('plano').value,limiteMensagens:parseInt(document.getElementById('limiteMensagens').value),precoPorMensagemExcedente:parseFloat(document.getElementById('precoPorMensagemExcedente').value),trialAte:document.getElementById('trialAte').value||null,descricao:document.getElementById('descricao').value,conhecimento:document.getElementById('conhecimento').value,limites:document.getElementById('limites').value,roteiroAnamnese:roteiroAnamnese.length?roteiroAnamnese:undefined,lojas,faq};
const r=await fetch('/api/admin/clients',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${pass}`},body:JSON.stringify(payload)});
const d=await r.json();if(d.success){alert('✅ Cliente salvo com sucesso!');document.getElementById('webhookUrl').style.display='block';document.getElementById('webhookUrl').innerText=`Webhook (configure exatamente assim na WAME API): ${window.location.origin}/webhook/${payload.clientId}/${d.client.webhookSecret}`}else alert('❌ Erro: '+d.error)}

async function verUso(clientId){const r=await fetch(`/api/admin/uso/${clientId}`,{headers:{Authorization:`Bearer ${pass}`}});const u=await r.json();alert(`📊 Uso do mês (${u.mes}):

💬 Mensagens: ${u.mensagensEnviadas}
⚠️ Excedentes: ${u.mensagensExcedentes}
🔤 Tokens entrada: ${u.inputTokens}
🔤 Tokens saída: ${u.outputTokens}
💰 Custo de IA: R$ ${(u.custoIA||0).toFixed(2)}`)}

async function carregarClientes(){const r=await fetch('/api/admin/clients',{headers:{Authorization:`Bearer ${pass}`}});const c=await r.json();document.getElementById('listaClientes').innerHTML=c.map(x=>{let badge='<span class="badge">ativo</span>';if(x.trialAte){badge=new Date(x.trialAte)>new Date()?'<span class="badge trial">trial</span>':'<span class="badge expired">expirado</span>'}return`<div class="client-item"><h3>${x.nomeEmpresa} ${badge}</h3><p><strong>ID:</strong> ${x.clientId} | <strong>Plano:</strong> ${x.plano} | <strong>Limite:</strong> ${x.limiteMensagens} msgs/mês | <strong>Excedente:</strong> R$ ${(x.precoPorMensagemExcedente||0).toFixed(2)}/msg</p><p><strong>Filiais:</strong> ${Object.keys(x.lojas||{}).length} | <strong>FAQ:</strong> ${(x.faq||[]).length}</p><div class="webhook-url">${window.location.origin}/webhook/${x.clientId}/${x.webhookSecret||'(sem segredo gerado — recadastre a filial ou peça pra alguém gerar um)'}</div><button class="small secondary" style="margin-top:8px" onclick="verUso('${x.clientId}')">📊 Ver uso do mês</button></div>`}).join('')}

async function carregarClientesNoFiltro(){const r=await fetch('/api/admin/clients',{headers:{Authorization:`Bearer ${pass}`}});const c=await r.json();const sel=document.getElementById('leadClientFilter');sel.innerHTML='<option value="">Selecione um cliente</option>'+c.map(x=>`<option value="${x.clientId}">${x.nomeEmpresa}</option>`).join('')}

async function carregarLeads(){const cid=document.getElementById('leadClientFilter').value;if(!cid)return;const r=await fetch('/api/admin/leads/'+cid,{headers:{Authorization:`Bearer ${pass}`}});const leads=await r.json();document.getElementById('listaLeads').innerHTML=leads.map(l=>`<div class="lead-item ${l.status}"><div><strong>${l.phone}</strong> — ${l.lojaNome||'Sem filial'}<br><small>${l.resumo?.substring(0,80)||''}</small></div><span class="badge" style="text-transform:uppercase">${l.status}</span></div>`).join('')||'<p>Nenhum lead encontrado.</p>'}

async function carregarStats(){const r=await fetch('/api/admin/stats',{headers:{Authorization:`Bearer ${pass}`}});const s=await r.json();const tm=s.reduce((a,x)=>a+(x.mensagensEnviadas||0),0);const tl=s.reduce((a,x)=>a+(x.leadsGerados||0),0);const th=s.reduce((a,x)=>a+(x.pedidosHumano||0),0);const tc=s.reduce((a,x)=>a+(x.custoIA||0),0);document.getElementById('statsGrid').innerHTML=`<div class="stat-box"><div class="number">${s.length}</div><div class="label">Dias</div></div><div class="stat-box"><div class="number">${tm}</div><div class="label">Mensagens</div></div><div class="stat-box"><div class="number">${tl}</div><div class="label">Leads</div></div><div class="stat-box"><div class="number">${th}</div><div class="label">Humanos</div></div><div class="stat-box"><div class="number">R$ ${tc.toFixed(2)}</div><div class="label">Custo IA</div></div>`}
</script>
</body>
</html>
